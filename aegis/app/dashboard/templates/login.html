{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>AEGIS</h1>
  <p class="muted">Autonomous research &amp; execution agent</p>
  {% if not configured %}
  <div class="flash err">No admin password is configured. On the server run:<br><code>aegis set-password</code></div>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <label>Username <input name="username" autocomplete="username" autocapitalize="none" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
