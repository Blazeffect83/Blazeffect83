[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent"
version = "1.0.0"
description = "AEGIS: autonomous research & execution agent for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0,<2",
    "pydantic>=2.6,<3",
    "defusedxml>=0.7,<1",
    "python-multipart>=0.0.9",
    # pytest is a runtime dependency: the sandbox uses it to run tests for
    # development objectives.
    "pytest>=8,<10",
]

[project.scripts]
aegis = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dashboard/templates/*.html", "dashboard/static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B008", "B904", "B023"]
