# ------------------------------------------------------------------------------------------------ faults
[[fault]]
id = "brain-drive-missing"
title = "The brain's drive is not there"
area = "storage"
codes = ["storage/brain_missing"]
patterns = ["which is not plugged in", "not mounted", "MOVED-TO-DRIVE"]
symptoms = [
    "the feed says 'paused — the brain lives on the drive …, which is not plugged in'",
    "doctor: brain ✗ 'the brain lives on …, which is not mounted'",
    "lsblk shows no sda, or sda without a mount under /mnt/polymath",
]
causes = [
    { cause = "the enclosure stayed in its safe-off state after a reboot (DockCase capacitor)", prior = 0.35 },
    { cause = "the drive browned out: not enough power from the Pi's USB port", prior = 0.3 },
    { cause = "unplugged, or a loose or charge-only cable", prior = 0.2 },
    { cause = "the USB bridge froze (UAS) and dropped off the bus", prior = 0.15 },
]
checks = [
    "lsblk -o NAME,SIZE,TRAN,MOUNTPOINTS",
    "lsusb | grep 31db:9210",
    "vcgencmd get_throttled   (anything but 0x0: the Pi saw low voltage)",
    "journalctl -u 'polymath-volume@*' -n 30",
]
self_healing = [
    "the agent waits visibly and starts by itself when the drive is back (v0.5.2)",
    "storage heal: asks udev again, soft-resets a 0-byte drive, then cuts the USB power with uhubctl (v0.5.5)",
    "after 5 minutes it learns on the standby brain on the SD card (v0.6.0)",
]
steps = [
    { needs = "auto", do = "wait: storage heal tries every minute (polymath doctor shows what it did)" },
    { needs = "you", do = "check the cable and that the SSD sits in a blue USB 3 port" },
    { needs = "sudo", do = "bring it back now", command = "sudo polymath storage heal" },
    { needs = "you", do = "unplug the enclosure for 10 s and plug it back in (a real power cycle)" },
]
since = "0.5.2"
updated = "0.6.0"

[[fault]]
id = "brain-drive-zero-bytes"
title = "The USB enclosure answers but the drive inside reports 0 bytes"
area = "storage"
codes = []
patterns = ["reports 0 bytes", "0B usb"]
symptoms = ["lsblk shows 'sda 0B usb'", "doctor: drives ✗ '/dev/sda is connected by USB but reports 0 bytes'"]
causes = [
    { cause = "the SSD did not power up behind the bridge (power, safe-off state)", prior = 0.6 },
    { cause = "the bridge is stuck after a brown-out", prior = 0.4 },
]
checks = ["lsblk -o NAME,SIZE,TRAN", "cat /sys/block/sda/size", "vcgencmd get_throttled"]
self_healing = [
    "never treated as blank, never formatted (v0.5.3)",
    "storage heal soft-resets that USB device every 2 min, then cuts the USB power (v0.5.5)",
]
steps = [
    { needs = "auto", do = "wait for storage heal (USB reset, then a power cut)" },
    { needs = "approval", do = "install uhubctl so the power cut can work", command = "sudo dpkg --configure -a && sudo apt-get install -y uhubctl" },
    { needs = "you", do = "unplug the enclosure for 10 s; if it recurs, power it from a powered USB hub" },
]
since = "0.5.3"
updated = "0.5.5"

[[fault]]
id = "brain-mount-dead"
title = "The brain's mount is dead (Input/output error)"
area = "storage"
codes = ["storage/heal:dead_mount:*"]
patterns = ["Input/output error", "storage does not answer"]
symptoms = [
    "doctor: brain ✗ 'its storage at /srv/polymath does not answer (Input/output error)'",
    "install.sh: 'changing ownership of /srv/polymath: Input/output error'",
    "the drive came back as a new device (sdb) while /srv/polymath still points at the old one",
]
causes = [{ cause = "the drive dropped off USB and re-enumerated; the old bind mount points at the dead device", prior = 1.0 }]
checks = ["findmnt /srv/polymath", "lsblk -o NAME,SIZE,TRAN,MOUNTPOINTS", "sudo dmesg | grep -iE 'usb|I/O error|reset' | tail -30"]
self_healing = [
    "found by reading, not trusted (v0.5.4); the agent waits instead of crashing",
    "storage heal drops the dead mount, resets the drive and attaches it again (v0.5.5–v0.5.7)",
]
steps = [
    { needs = "auto", do = "storage heal replaces the mount within a minute or two" },
    { needs = "sudo", do = "now", command = "sudo polymath storage heal" },
    { needs = "sudo", do = "if that does not help", command = "sudo reboot" },
]
since = "0.5.4"
updated = "0.5.7"

[[fault]]
id = "brain-mount-frozen"
title = "The brain's drive froze: reads never return"
area = "storage"
codes = []
patterns = ["does not answer at all", "a timeout was exceeded", "database is locked", "start-pre operation timed out"]
symptoms = [
    "systemctl: 'Job for polymath.service failed because a timeout was exceeded'",
    "the dashboard is not listening; processes sit in state D (ps -eo stat,cmd | grep ' D')",
    "doctor: brain ✗ '… does not answer (it does not answer at all)'",
]
causes = [
    { cause = "the enclosure's USB bridge froze under UAS (common on the Pi 4)", prior = 0.55 },
    { cause = "power dip on the USB port", prior = 0.35 },
    { cause = "the SSD itself is failing", prior = 0.1 },
]
checks = [
    "sudo dmesg | grep -iE 'uas|reset|I/O error|task .* blocked' | tail -30",
    "ps -eo pid,stat,cmd | awk '$2 ~ /D/'",
    "vcgencmd get_throttled",
]
self_healing = [
    "nothing in Polymath waits on it: every look has a time limit (v0.5.7); loading the config too (v0.6.0)",
    "storage heal: lazy unmount, USB reset of the frozen drive, restart without waiting (v0.5.7)",
    "after 5 minutes: the standby brain on the SD card (v0.6.0)",
    "probes read past the page cache, so a frozen drive with cached data is caught too (v0.6.2)",
    "'database is locked' from a process stuck on the drive reads as a missing drive, not a crash loop (v0.6.2)",
]
steps = [
    { needs = "auto", do = "wait: storage heal resets the drive; the agent learns on standby meanwhile" },
    { needs = "approval", do = "free it and reinstall in one command (✓/✗ per step; log in ~/polymath-rescue.txt; installs uhubctl)", command = "cd ~/polymath-src/polymath && sudo ./scripts/rescue.sh" },
    { needs = "approval", do = "stop the freezes at their root: see brain-drive-uas and brain-drive-power" },
    { needs = "approval", do = "until the SSD is fixed: run everything on the SD card (the SSD is let go of and switched off; nothing on it is touched)", command = "cd ~/polymath-src/polymath && sudo ./scripts/sd-card-mode.sh on" },
]
since = "0.5.7"
updated = "0.7.0"

[[fault]]
id = "update-not-installed"
title = "An update was pulled but never installed (the Pi runs an older Polymath)"
area = "install"
codes = []
patterns = ["is installed but the agent", "build.json", "not the Polymath branch", "still installed:", "nothing changed"]
symptoms = [
    "polymath version (or /opt/polymath/build.json) shows an older version than the newest on GitHub",
    "git -C ~/Blazeffect83 branch shows a branch other than claude/polymath-agent (on 2026-10-14: claude/aegis-agent)",
    "fixes that should be there are not: the tracebacks' line numbers match an old release",
]
causes = [
    { cause = "the clone is checked out on another project's branch, so git pull fetched that branch", prior = 0.7 },
    { cause = "git pull ran, but install.sh was not run afterwards (or stopped early)", prior = 0.3 },
]
checks = [
    "cat /opt/polymath/build.json",
    "git -C ~/Blazeffect83 status -sb; git -C ~/Blazeffect83 branch -vv",
    "git -C ~/Blazeffect83 log --oneline --branches --not --remotes   (local-only commits: never reset these)",
]
