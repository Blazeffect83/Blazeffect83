# ------------------------------------------------------------------------------------------------ updates
[[update]]
version = "0.11.0"
date = "2026-10-25"
changes = """Drive roles (body/roles.py, every minute with storage heal, as root, not in SD-card mode) and what each drive holds (memory/inventory.py, in the agent). ROLES: every adopted drive is scored: the connection (NVMe 6, USB 3 at 10 Gbit/s 5, at 5 Gbit/s 4), +2 for an SSD (queue/rotational), up to +2 for its measured read speed (16 MiB at start/middle/end past the cache, once a day), up to +1 for room, −1 per drop-out this week. The brain may only go on a Linux-formatted drive of Polymath's own, on USB 3/NVMe (USB 2 only with brain_allow_usb2), with room for 3× the brain, plugged in 10 min (brain_settle_min) and fewer than 3 drop-outs this week. Off the SD card it moves onto the best such drive once it has settled (Helper.move_home; attach no longer moves the brain itself when auto_roles is on). Between drives (Helper.move_brain: copy, quick_check, umount, the old drive's copy renamed home-previous-<time>, manifests and the SD card's MOVED-TO-DRIVE.json updated, bind mount) when a drive scores 2 more, at night (backup_hour+1 to +4), at most once a day; at once when the brain's drive dropped out 3 times this week. A failed move waits 6 h. The old copy is deleted after a steady week. Backups go to the steadiest other physical drive with room (memory.pool.backup_dir reads /run/polymath/drive-roles.json); spills fill extra drives before the backup drive. Warnings: drives asking for more than the Pi 4's 1200 mA of USB power; backups on the brain's own drive; the brain's drive on USB 2. polymath storage roles, storage list (role column), doctor (drives line), the dashboard, inbox codes storage/roles:<event>. INVENTORY: hourly, per drive: documents spilled there, text, sources, topics, facts resting on them, downloads, backups, old brain copies (kv inventory and polymath-brain/inventory.json on the drive). RELEARNING: a drive gone relearn_after_h (2 h) counts as lost: its documents are marked lost (meta.lost, pointer kept), queued in table relearn by priority (10 per fact resting on it, 50 for a topic Christian asked about, a little for size), and sent 300 a run / 3000 a day: Wikipedia via wikipedia.titles (byte ranges, no download), web/feed pages via the crawler, other dumps 'later'. A relearned copy replaces the lost body (DocumentStore.add) and spills to the drives that are there. A backup is taken if the drive held backups; downloads are planned again. If the drive comes back, the documents read again and the queue entries go ('back'). Feed lines 'drive X is still gone … relearning N' and 'drive X is back', doctor 'relearning', inbox codes storage/relearn:lost|back. Not in SD-card mode or on standby."""

[[update]]
version = "0.10.0"
date = "2026-10-25"
changes = """The SSD watch (body/ssdwatch.py, run every minute with storage heal, as root). In SD-card mode it looks for the brain's SSD (the filesystem the SD card's MOVED-TO-DRIVE.json names) and says what it sees in the feed, doctor and the dashboard: not plugged in; the enclosure on USB but no drive or a drive reporting 0 bytes (needs more power; one soft USB reset per 10 min); USB 2 (refused: what made it freeze); switched off by sd-card-mode.sh on (switched on to test it after 1 h, 3 h, 6 h, 12 h, then daily, and off again if no drive shows up); or checking. A check reads 16 MiB at the start, middle and end of the partition past the page cache in a child process with a 30 s limit (a frozen drive never blocks it) and the drive's I/O error count must not grow; a replug starts over at once. After 10 healthy minutes (sd_return_stable_min) it does what sd-card-mode.sh off does: stop the agent and dashboard, set the drop-in aside, restart polymath-volume@<partition> (which mounts the SSD and starts everything); the agent folds the SD-card brain in. Not mounted within 3 min: the drop-in comes back, everything starts on the SD card, backoff 30 min → 1 h → … → a day. After an automatic return the SSD is on probation for a day: 2 drive-helper rescues (dead mount, USB reset, power cycle) in that day and it goes back to SD-card mode by itself (drop-in, lazy unmounts, the SSD's USB device switched off) and tests the SSD again a day later. A move cut short (power cut, time limit) is finished or undone on the next run, and everything started again. Nothing in the first hour after sd-card-mode.sh on. It never formats or deletes. Settings: [storage] sd_auto_return, sd_return_stable_min, sd_return_allow_usb2, sd_auto_fallback. Events go to the caretaker's inbox as storage/ssd_watch:<event>. polymath-heal.service may now run 10 min (moving the brain)."""

[[update]]
version = "0.9.0"
date = "2026-10-25"
changes = """Private access, a security audit, leaner storage. ACCESS: the dashboard used to listen on the whole network with no sign-in. Now the Pi's own listener is loopback only (http://127.0.0.1:8765, no sign-in: the live feed, doctor, the Pi's browser), and other devices use https://<pi>:8443: home network only (checked per request and by systemd IPAddressAllow), TLS 1.2+ with a certificate from Polymath's own small CA (scripts/access-cert.sh, run by install.sh; renewed when the Pi's address changes or within 30 days of expiry), and a paired device. polymath access pair (install.sh prints one) gives a one-time code (15 min, 5 wrong guesses cancel it, 10 attempts per address per 10 min); the browser gets a 256-bit device key in an HttpOnly, Secure, SameSite=Strict cookie (the Pi keeps only its SHA-256, files 0600 in /var/lib/polymath/access). Host header checked (DNS rebinding), POSTs must be JSON from the page's own origin (CSRF), on both listeners. polymath access devices|revoke|log; the dashboard's Who can see this panel lists devices, revokes them, makes codes; Chrome can install it as an app window (manifest, service worker that caches nothing). SECURITY AUDIT fixes: the root helpers (volumes, heal) no longer follow symlinks planted in polymath-owned folders (core/safefs.py: O_NOFOLLOW, dir_fd, fchown); every unit hardened (no capabilities, MemoryDenyWriteExecute tested under the kernel's MDWE, @system-service syscall filter, ProtectProc, UMask 0027; the root helpers get the namespace-free subset); page titles can no longer carry terminal escape codes into the feed; HTTP decompression is bounded; a bad Content-Length no longer errors; the rate limiter no longer grows without bound; remote /health hides the build; installed code is owned by root. STORAGE: in SD-card mode one backup (was two) taken weekly (was nightly: each wrote the whole brain twice to the card), older backups go first when room is short, the card keeps 3 GB free (was 2); polymath storage usage [--detail] shows where the room goes and a forecast; the dashboard shows it; Orin opens disk_low early when the forecast says the reserve is reached within 3 days, and its backup-age limit follows the backup interval (no false alarm with weekly backups)."""

[[update]]
version = "0.8.2"
date = "2026-10-22"
changes = """Christian: the agent goes offline for a few minutes after learning something. Measured on a copy of a real brain: single steps ran for minutes (the backup 250 s, a quiz 82 s, embedding training 24 s, on a fast x86; the Pi is several times slower and its SD card far slower). The feed called the agent offline after 60 s without a sign of life, and systemd's watchdog restarted it after 120 s, with growing pauses (RestartSteps), so the step started over. Fixes: the vigil (core/vigil.py), a thread that vouches for the agent while it makes progress (systemd watchdog, pulse, /run/polymath/pulse.json) and goes quiet after 15 min without progress, so a real hang is still restarted; the feed and dashboard read the pulse: online, what it is doing right now, and 'one long step: 4 min so far'; slow steps are recorded (kv slow_steps) and reported once a day (jobs/slow:<kind>, fault job-slow). Efficiency: search keeps recently decoded documents (24M characters, keyed by content hash) and counting hits no longer opens documents, so a quiz is about 3 times faster (22 s to 8 s); Orin no longer queues a backup, probe or eviction already due (the backup ran twice back to back); embedding training reads its vocabulary every 15 min instead of every slice; Orin's reading-rate signal and the LEARNING lines no longer scan or sort the whole documents table; the watchdog notifier no longer keeps every message it sent."""

[[update]]
version = "0.8.1"
date = "2026-10-15"
changes = """Christian asked to see what it is learning and how far along it is. The live feed's header has two LEARNING lines (header 6 rows instead of 4), and the dashboard and the live page have a LEARNING card: the subject (the topic curiosity pursues, what you asked about, the wrong answer it reads up on, an agent's subject, or the dump part or file), who chose it, what it read last, how well it knows the topic (a bar: right answers when quizzed on it, else the share of the things its articles mention that it has read; live for topics up to 400 articles, hourly above) with what this round added, and this round's progress (articles of the batch, share of a dump, books). Between topics it shows the last one and what is next. Feed lines when a round starts and when it finishes (knows 34% → 41%); the face is proud after a round that taught it something. New module interface/focus.py (read-only); reading jobs from polymath learn and from mistakes now name their subject (payload about/topic_id). Nothing new is written to the database."""

[[update]]
version = "0.8.0"
date = "2026-10-15"
changes = """Orin the Caretaker is built (agents/caretaker.py, job caretaker.step every 2 minutes, urgent, also during a pause). Each turn: learned normal bands (median ± k·MAD over a week, k tuned by false alarms) and hard limits on temperature, free space, memory, the WAL, backups, the internet, reading rate, quiz accuracy and safety lists; failing and dead jobs; the problems inbox; power, USB speed, build, configuration and permissions. Incidents (table incidents) rank causes by Bayes, run the most informative read-only check, apply a bounded Tier 1 remedy (slow down, evict, backup, WAL checkpoint, probe, requeue, quarantine 6 h, safety lists, roll back a tuned setting, replan), verify it after its window and learn what works (fault_stats), or escalate once a day with what/evidence/cause/step quoted from this file. Faults on hold ([situation] on_hold) are noted, never escalated. Shown in the feed (tag Orin), the face (mending, proud), doctor (Orin lines) and polymath caretaker [incidents]. New faults: agent-memory-high, wal-growing, backup-stale, blocklists-stale, ingest-stall, quiz-accuracy-drop, pi-under-voltage, update-not-running, config-changed, data-dir-permissions."""

[[update]]
version = "0.7.0"
date = "2026-10-15"
changes = """SD-card mode: the whole brain runs on the SD card (/var/lib/polymath/brain, storage.sd_only) while the SSD cannot be trusted. scripts/sd-card-mode.sh on|off|status switches it with one drop-in (/etc/polymath/polymath.d/sd-card.toml; polymath.toml is never edited): on stops everything, unmounts the SSD and switches its USB device off, starts the SD-card brain from the SD card's old copy (renamed, not copied) or empty, installs and checks; off switches the SSD back on and the mode off, and keeps SD-card mode if the SSD does not come back. In SD-card mode no drive is touched (no pool, no move or mount of the brain's drive, no heal, no standby), the budget is what the card can give less 2 GB, two backups are kept, and the feed, doctor and the inbox (storage/sd_card) say so. After off, the fold job (storage.fold_standby) moves what was learned on the SD card onto the SSD, then removes the SD-card brain. Configuration drop-ins (polymath.d/*.toml) are new; scripts/ops-lib.sh holds what rescue.sh and sd-card-mode.sh share; rescue.sh lets go of a drive in SD-card mode instead of waiting for it."""

[[update]]
