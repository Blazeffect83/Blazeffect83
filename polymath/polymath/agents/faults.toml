# The caretaker's knowledge: every problem Polymath has met, how to recognise it, what Polymath already does about
# it by itself, and the exact steps for Christian. Read by `polymath caretaker`, `polymath doctor`, the issue inbox
# (core/issues tags each problem with the faults it matches) and, once built, Orin the Caretaker (docs/CARETAKER.md).
#
# KEEP IT CURRENT. Every update of Polymath updates this file in the same commit (tests/test_faults.py fails
# otherwise):
#   * [meta] updated_for = the new version, and an [[update]] entry saying what changed for the caretaker;
#   * a [[fault]] for every new way things can fail, and every issue code the code reports must match one;
#   * [situation] = what is true on the Pi right now; [[history]] = what happened on it, in order.
#
# Step `needs`:  auto     = Polymath does it by itself (nothing to do)
#                caretaker = the caretaker may do it itself (Tier 1: bounded, logged, reversible)
#                you      = Christian, no sudo
#                sudo     = Christian, with sudo (Tier 2: the caretaker only tells, with the exact command)
#                approval = changes the system (boot settings, packages, hardware): ask Christian first, always

[meta]
updated_for = "0.11.0"
updated = "2026-10-25"
pi = "Raspberry Pi 4 Model B 8 GB, Debian 13 (trixie), 64-bit, hostname piS, user christian"
brain_drive = "1 TB SSD in a DockCase enclosure (USB 31db:9210), /dev/sda2 ext4, bus-powered from the Pi"

[situation]
