symptoms = ["a problem line: 'storage.fold_standby …'", "/var/lib/polymath/standby still holds a brain after the drive is back"]
causes = [{ cause = "an error while folding (disk full on the drive, a damaged standby database)", prior = 1.0 }]
checks = ["journalctl -u polymath -n 80 | grep -i standby", "df -h /srv/polymath"]
self_healing = ["the fold is resumable and idempotent: requeueing it continues where it stopped; the standby brain is kept until it is done"]
steps = [
    { needs = "caretaker", do = "requeue the fold job once the cause is gone" },
    { needs = "sudo", do = "send the log", command = "journalctl -u polymath -n 120 --no-pager" },
]
since = "0.6.0"
