waiting_on = [
    "2026-10-15: Christian reports Polymath is up and running again (on the SD card); the step 7 lines themselves were not sent",
    "2026-10-22: Christian: 'it's going good' (v0.8.1 installed, on the SD card), but the agent goes offline for a few minutes after learning something",
    "2026-10-25: Christian likes how it is going; still working on the SSD himself (on hold). Asked for: storage that does not run out, a security check, and private access from his PC's Chrome on the home network only",
    "install v0.9.0 (private access from your PC, security hardening, leaner storage): cd ~/polymath-src && git pull --ff-only origin claude/polymath-agent && cd polymath && sudo ./install.sh   (it prints a pairing code at the end; SD-card mode stays on)",
    "then on the PC (Chrome): open the https address install.sh printed, Advanced → Proceed, type the pairing code; optional: trust the Pi's certificate (the pairing page shows how) and Install Polymath as an app window",
