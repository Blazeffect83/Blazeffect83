checks = [
    "cd ~/polymath-src/polymath && ./scripts/sd-card-mode.sh status",
    "df -h /var/lib/polymath/brain   (the SD card's free space)",
    "ls /etc/polymath/polymath.d/   (sd-card.toml: the switch)",
]
self_healing = [
    "it learns as usual, dumps included, inside what the card can give (what it uses + free − 2 GB); the guard and eviction keep 2 GB free",
    "no drive is touched: no storage pool, no moving or mounting the brain's drive, no storage heal, no standby brain",
    "the SD card wear guard watches its writes (saver mode when it writes too much); two nightly backups are kept",
    "after sd-card-mode.sh off, what it learned on the SD card moves onto the SSD by itself (the fold job), with the agents Christian set up there; then the SD-card brain is removed",
]
steps = [
    { needs = "auto", do = "keep learning on the SD card; nothing to do while the SSD is being fixed" },
    { needs = "you", do = "fix the SSD at the Pi: a blue USB 3 port, a USB 3 cable, no USB 2 hub; a powered hub if it still drops out (see brain-drive-usb2, brain-drive-uas, brain-drive-power)" },
    { needs = "approval", do = "back to the SSD once it works (if the SSD does not come back, SD-card mode simply stays on)", command = "cd ~/polymath-src/polymath && sudo ./scripts/sd-card-mode.sh off" },
]
