self_healing = ["storage heal brings the drive back each time; the standby brain keeps learning in between"]
steps = [
    { needs = "approval", do = "power the enclosure from a powered USB hub, or use the official 5.1 V / 3 A Pi supply" },
]
since = "0.6.1"
updated = "0.6.1"

