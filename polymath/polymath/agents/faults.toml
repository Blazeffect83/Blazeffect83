# The caretaker's knowledge: every problem Polymath has met, how to recognise it, what Polymath already does about
# it by itself, and the exact steps for Christian. Read by `polymath caretaker`, `polymath doctor`, the issue inbox
# (core/issues tags each problem with the faults it matches) and, once built, Orin the Caretaker (docs/CARETAKER.md).
#
# KEEP IT CURRENT. Every update of Polymath updates this file in the same commit (tests/test_faults.py fails
# otherwise):
#   * [meta] updated_for = the new version, and an [[update]] entry saying what changed for the caretaker;
#   * a [[fault]] for every new way things can fail, and every issue code the code reports must match one;
#   * [situation] = what is true on the Pi right now; [[history]] = what happened on it, in order.
#
# Step `needs`:  auto     = Polymath does it by itself (nothing to do)
#                caretaker = the caretaker may do it itself (Tier 1: bounded, logged, reversible)
#                you      = Christian, no sudo
#                sudo     = Christian, with sudo (Tier 2: the caretaker only tells, with the exact command)
#                approval = changes the system (boot settings, packages, hardware): ask Christian first, always

[meta]
updated_for = "0.6.1"
updated = "2026-10-14"
pi = "Raspberry Pi 4 Model B 8 GB, Debian 13 (trixie), 64-bit"
brain_drive = "1 TB SSD in a DockCase enclosure (USB 31db:9210), bus-powered from the Pi's USB 3 port"

[situation]
as_of = "2026-10-14"
summary = """The Pi runs v0.5.6. After that install polymath.service failed to start ("a timeout was exceeded") and \
the dashboard was not listening: the brain's mount on /srv/polymath froze (reads never return). uhubctl is not \
installed because dpkg was interrupted. v0.6.1 is ready: nothing waits on a frozen drive any more, the \
configuration loads without touching the drive, and after 5 minutes without its drive Polymath learns on the \
standby brain on the SD card. Christian is away from the Pi and runs commands remotely."""
waiting_on = [
    "sudo dpkg --configure -a && sudo apt-get install -y uhubctl (finish the interrupted package install)",
    "cd ~/Blazeffect83/polymath && git pull && sudo ./install.sh --allow-sd-card (install v0.6.1)",
    "polymath doctor (send the output)",
]
suspected_root_cause = "the DockCase's USB bridge freezing under UAS, and/or not enough power from the Pi's USB port"
recommended = [
    "brain-drive-uas",
    "brain-drive-power",
]

