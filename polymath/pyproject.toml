[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polymath"
version = "0.4.3"
description = "From-scratch autonomous learning agent for Raspberry Pi 5 (stdlib + numpy only)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
polymath = "polymath.interface.cli:main"

[tool.setuptools.packages.find]
include = ["polymath*"]

[tool.setuptools.package-data]
polymath = ["core/migrations/*.sql", "interface/static/*", "default.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["polymath", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer-running tests"]

[tool.coverage.run]
source = ["polymath"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
